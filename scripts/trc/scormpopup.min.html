<!DOCTYPE html><html><head><title></title><meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script>var courseFrame=null,theLoader=null;function startup(){theLoader=new CourseLoader();theLoader.start();}
function pageLoaded(){courseFrame=document.getElementById("courseFrame");if(!courseFrame)
throw new Error("Invalid course frame");}
function courseLoaded(){if(theLoader)
theLoader.sendInvite();}
function CourseLoader(){var self=this,timer=0,token=null,parentScorm=null,scorm=null,url=null,invite=null;function _error(step,err){return alert(step+" error: "+TRC.getErrorMessage(err));}
function createHidden(form,name,value){var input=document.createElement("INPUT");input.type="hidden";input.name=name;input.value=value;form.appendChild(input);return input;}
this.start=function(){try{if(timer){clearTimeout(timer);timer=0;}
if(!courseFrame||!TRC.ScormProvider){timer=setTimeout(self.start,50);return;}
var popup=window.opener,query=TRC.parseUrl(""+document.location).query,url=query.url;if(!query.scormtoken)
throw new Error("Missing scormtoken.");if(!url)
throw new Error("Missing course url.");token="scorm"+query.scormtoken;parentScorm=popup[token];if(!parentScorm)
throw new Error("SCORM API of the main window is inaccessible.");window.document.title="Loading "+parentScorm.getTitle()+"...";parentScorm.stopListen();scorm=new TRC.ScormProvider({relay:parentScorm});scorm.initialize(function(){try{invite=scorm.newInvite();url=invite.formatUrl(url);if(String.toLowerCase(query.method)==="post"){var form=document.forms[0],studentId=createHidden(form,"studentId",scorm.getStudentId()),studentName=createHidden(form,"studentName",scorm.getStudentName());TRC.setAttr(form,"action",url);TRC.setAttr(form,"target",courseFrame.name);form.submit();}
else{courseFrame.src=url;}}
catch(err){_error("Course frame",err);}},function(err){_error("Scorm initialize",err);});}
catch(err){_error("Page load",err);}};this.sendInvite=function(){if(invite)
invite.send(courseFrame.contentWindow);};}</script><script src="trc.js" data-config="scripts: ['trc.scorm.js'], startup: startup"></script></head><body style="margin:0 0 0 0" onload="pageLoaded()"><form method="post" name="__courseForm__"><iframe id="courseFrame" name="__courseFrame__" style="position:absolute;top:5px;left:0;width:100%;height:100%;border-style:none;box-sizing:border-box" frameborder="0" onload="courseLoaded()"></iframe></form></body></html>
