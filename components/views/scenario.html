<div data-bind="css : { active : $root.isActive, inactive : !$root.isActive }" class="scenario">
    <div class="description" data-bind="css: {hideElement : isContinueClicked}">
        <div class="instructor">
            <div class="photo">
            </div>
            <div class="colonels-name">
                Col Sandoval
            </div>
        </div>
        <div class="explanation" data-bind="text:explanation"></div>
    </div>
    <div class="continue-btn" data-bind="click:submit, css: {hideElement : isContinueClicked}"></div>
    <div class="container" data-bind="scenarioUp: isContinueClicked">
        <div class="firstColumn" data-bind="foreach:functionLibrary">
            <div class="functionEl" data-bind="text: $data"></div>
        </div>
        <div class="functionDrop" data-bind="foreach:subtasks">
            <div class="el"></div>
        </div>
        <div class="secondColumn" data-bind="foreach:subtasks">
            <div data-bind="text: $data"></div>
        </div>
        <div class="elementDrop" data-bind="foreach:subtasks">
            <div class="el"></div>
        </div>
        <div class="up-btn" data-bind="click: scrollUp"></div>
        <div class="thirdColumn" data-bind="foreach:elementLibrary">
            <div class="element more_info" data-bind="truncatedText: $data,  maxTextLength: 17, attr: {title: $data}">
                
            </div>
        </div>
        <div class="down-btn" data-bind="click: scrollDown"></div>
    </div>
    <div class="reset" data-bind="click: reset"></div>
    <div class="evaluate" data-bind="click: evaluate"></div>
</div>
