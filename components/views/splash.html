<div class="splash">
    <!-- ko if: !unlocked() -->
    <div class="splash-lock" data-bind="click: function(){}, clickBubble: false">
        <h2 class="splash-lock-title">Access Required</h2>
        <p class="splash-lock-copy">Enter the access code to begin the Joint Functions activity.</p>
        <label class="splash-lock-label" for="activityAccessCode">Access code</label>
        <input id="activityAccessCode" class="splash-lock-input" type="password" maxlength="12"
               data-bind="value: password, valueUpdate: 'input', hasFocus: passwordFocused, event: { keyup: onPasswordKeyup }"
               autocomplete="off" inputmode="numeric" placeholder="Enter code" />
        <p class="splash-lock-error" data-bind="visible: showError()">Incorrect access code. Try again.</p>
        <button type="button" class="splash-lock-submit" data-bind="click: submitPassword">Unlock</button>
    </div>
    <!-- /ko -->

    <!-- ko if: unlocked -->
    <div class="splash-proceed" data-bind="click: onButtonClick">CLICK ANYWHERE TO PROCEED</div>
    <!-- /ko -->
</div>
